[package]
name = "o1pvss"
version = "0.1.0"
edition = "2021"
description = "Constant-online publicly verifiable secret sharing from threshold encryption"
repository = "https://github.com/scottocs/O1PVSS"

[dependencies]
ark-std = "0.5.0"
ark-ec = "0.5.0"
ark-ff = "0.5.0"
ark-poly = "0.5.0"
ark-bls12-381 = "0.5.0"
ark-serialize = "0.5.0"
merlin = { version = "3.0.0", default-features = false }

[features]
asm = ["ark-ff/asm"]
